    - Project Structure: architecture/project-structure.md
    - Authentication: architecture/authentication.md
    - State Management: architecture/state-management.md
  - User Guide:
    - user-guide/index.md
    - Student Portal:
      - user-guide/student/dashboard.md
      - user-guide/student/attendance.md
      - user-guide/student/fees.md
      - user-guide/student/posts.md
      - user-guide/student/calendar.md
    - Admin Portal:
      - user-guide/admin/dashboard.md
      - user-guide/admin/students.md
      - user-guide/admin/events.md
      - user-guide/admin/posts.md
  - Developer Guide:
    - developer-guide/index.md
    - Services & API Layer: developer-guide/services.md
    - Components: developer-guide/components.md
    - Routing & Guards: developer-guide/routing.md
    - Styling Guide: developer-guide/styling.md
    - Adding Features: developer-guide/adding-features.md
  - API Reference:
