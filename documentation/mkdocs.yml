site_name: IC Student Portal
site_url: https://TipTopMaestro.github.io/IC-Student-Portal-Docs/
site_description: Complete documentation for the IC Student Portal — a web-based management system for the Institute of Computing at Davao del Norte State College.

repo_url: https://github.com/TipTopMaestro/IC-Student-Portal
repo_name: TipTopMaestro/IC-Student-Portal

theme:
  name: material
  logo: assets/icsa_logo.png
  favicon: assets/icsa_logo.png
  palette:
    # Dark mode (default) - Switch to light mode shows sun icon
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    # Light mode - Switch to dark mode shows moon icon
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  font:
    text: Noto Sans
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.path
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - toc.follow

markdown_extensions:
  # Emojis & Icons (Renders :material-...: and :octicons-...: shortcodes)
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  # Admonitions
  - admonition
  - pymdownx.details

  # Code blocks
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  # Content tabs
  - pymdownx.tabbed:
      alternate_style: true

  # Typography & formatting
  - pymdownx.mark
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TipTopMaestro/IC-Student-Portal

copyright: Copyright &copy; 2026 Institute of Computing — Davao del Norte State College

